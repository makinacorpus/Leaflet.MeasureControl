<!DOCTYPE html>
<html>
<head>
    <title>Leaflet.MeasureControl — Leaflet v2 demo</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.0/normalize.min.css">

    <!-- Dependency to Leaflet (v2, ESM only) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.css" />

    <!-- Files from current project -->
    <link rel="stylesheet" href="../leaflet.measurecontrol.css" />
</head>
<body>
    <main>
      <div id="map" style="width: 100%; height: 100vh; display: block;"></div>
    </main>

    <script type="importmap">
    {
        "imports": {
            "leaflet": "https://unpkg.com/leaflet@2.0.0-alpha.1/dist/leaflet.js"
        }
    }
    </script>
    <script type="module">
        import { Map, TileLayer } from 'leaflet';
        import { MeasureControl } from '../leaflet.measurecontrol.js';

        const osm = new TileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: 'Map data &copy; OpenStreetMap contributors',
        });

        const map = new Map('map')
            .setView([48.49, 1.4], 16)
            .addLayer(osm);

        new MeasureControl().addTo(map);
    </script>

    <script type="text/javascript">
        function toggleMenu () {
            var toggle = document.querySelector('.menu-toggle');
            var menu = document.querySelector('.menu');
            toggle.classList.toggle('close');
            menu.classList.toggle('closed');
        }

        function initMenu () {
            var toggle = document.querySelector('.menu-toggle');
            toggle.addEventListener('click', toggleMenu);
        }

        initMenu();
    </script>
</body>
</html>
